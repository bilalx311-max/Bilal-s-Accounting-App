<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="192" y2="192" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#11161F"/>
      <stop offset="100%" stop-color="#06080D"/>
    </linearGradient>
    <linearGradient id="flow" x1="20" y1="150" x2="172" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E0A64A"/>
      <stop offset="50%" stop-color="#4A94E8"/>
      <stop offset="100%" stop-color="#2BB583"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="4" y="4" width="184" height="184" rx="42" fill="url(#bg)" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>

  <g filter="url(#glow)" fill="none" stroke="url(#flow)" stroke-width="7" stroke-linecap="round">
    <path d="M34 146 L80 108 L112 128 L160 62" />
  </g>

  <g filter="url(#glow)">
    <circle cx="34" cy="146" r="9" fill="#E0A64A"/>
    <circle cx="80" cy="108" r="9" fill="#7C8FE0"/>
    <circle cx="112" cy="128" r="9" fill="#4A94E8"/>
    <circle cx="160" cy="62" r="10.5" fill="#2BB583"/>
  </g>
</svg>
